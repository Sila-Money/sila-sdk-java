name: Release to Maven Central

on:
  release:
    types: [published]

# The deploy reads the repository only. It never pushes with GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'zulu'

      # Import into a keyring under RUNNER_TEMP, not the default ~/.gnupg.
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | GNUPGHOME="$GNUPGHOME" gpg --batch --import
          GNUPGHOME="$GNUPGHOME" gpg --list-secret-keys --keyid-format LONG

      # The settings file holds only ${env.*} references. Maven reads the values from the
      # Maven deploy step's environment, so no secret is written to disk.
      # The server ID is not "central", because Maven also sends the credentials of a server
      # with that ID to its built-in central repository (repo.maven.apache.org).
      # repositoryOrigins (Maven 3.10+) limits the credentials to the Central Portal.
      - name: Write settings.xml
        run: |
          cat > "$RUNNER_TEMP/settings.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.1.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.1.0
                    http://maven.apache.org/xsd/settings-1.1.0.xsd">
            <servers>
              <server>
                <id>sonatype-central</id>
                <username>${env.SONATYPE_USER}</username>
                <password>${env.SONATYPE_PASSWORD}</password>
                <repositoryOrigins>
                  <repositoryOrigin>https://central.sonatype.com</repositoryOrigin>
                </repositoryOrigins>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>release-signing</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <properties>
                  <gpg.keyname>${env.GPG_KEY_ID}</gpg.keyname>
                </properties>
              </profile>
            </profiles>
          </settings>
          EOF

      # maven-gpg-plugin reads the passphrase from MAVEN_GPG_PASSPHRASE.
      # The gpg.passphrase property is deprecated because it can leak.
      - name: Maven deploy
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B clean deploy \
            -Prelease \
            -s "$RUNNER_TEMP/settings.xml" \
            -f SilaSDK/pom.xml

      - name: Remove GPG keyring
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/gnupg"
